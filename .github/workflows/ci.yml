
name: SmartDoc AI CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: smartdoc-ai-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

  docker-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t smartdoc-ai .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: smartdoc-ai-510812
      REGION: asia-south1
      REPOSITORY: smartdoc-repo
      IMAGE_NAME: smartdoc-ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/722361220782/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@smartdoc-ai-510812.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push Docker image
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME"
          docker build -t "$IMAGE_URI:$GITHUB_SHA" -t "$IMAGE_URI:latest" .
          docker push "$IMAGE_URI:$GITHUB_SHA"
          docker push "$IMAGE_URI:latest"

      - name: Deploy to Cloud Run
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME"

          gcloud run deploy "$IMAGE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE_URI:$GITHUB_SHA" \
            --service-account="722361220782-compute@developer.gserviceaccount.com" \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --timeout=300 \
            --concurrency=80 \
            --max=20 \
            --update-secrets="GEMINI_API_KEY=gemini-api-key:latest" \
            --quiet

      - name: Verify Cloud Run deployment
        run: |
          SERVICE_URL=$(gcloud run services describe "$IMAGE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format="value(status.url)")

          echo "Checking service: $SERVICE_URL"
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-connrefused \
            "$SERVICE_URL" \
            --output /dev/null
